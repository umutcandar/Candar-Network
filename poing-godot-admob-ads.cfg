[config]
name="AdMob"
binary="poing-godot-admob/bin/poing-godot-admob-ads.a"

initialization="register_poing_godot_admob_ads_types"
deinitialization="unregister_poing_godot_admob_ads_types"

[dependencies]
linked=[]
embedded=[]
system=[]
capabilities=[]
files=[
    "poing-godot-admob/libs/ads-pods.txt",
    "poing-godot-admob/scripts/update_and_install.sh",
    "poing-godot-admob/scripts/update_pods.rb"
]
linker_flags=[]

[android]
dependencies=[
    "com.google.android.gms:play-services-ads:23.0.0",
    "androidx.annotation:annotation:1.9.1"
]
manifest="poing-godot-admob/android/AndroidManifestChunk.xml"

[gradle]
buildscript= "poing-godot-admob/android/build.gradle"
settings= "poing-godot-admob/android/settings.gradle"
