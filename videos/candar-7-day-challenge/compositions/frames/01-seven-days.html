  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const SCENE_DURATION = 3;
      const PULSE = 0.2;
      const BEATS = [
        PULSE * 0.4,
        PULSE * 3.6,
        PULSE * 4.1,
        PULSE * 5.3,
        PULSE * 6.6,
        PULSE * 8.9,
        PULSE * 9.7,
        PULSE * 10.8,
        PULSE * 11.8,
      ];

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-seven-days"] = tl;

      tl.fromTo(
        "#frame-01-seven-days-lockup",
        { scale: 1.55, filter: "blur(18px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.5,
          ease: "power4.out",
        },
        BEATS[0],
      );

      tl.fromTo(
        ".frame-01-seven-days-kicker",
        { x: -180, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" },
        BEATS[1],
      );

      const numberSequence = [
        { t: 0, text: "1" },
        { t: BEATS[2], text: "2" },
        { t: BEATS[3], text: "4" },
        { t: BEATS[4], text: "7" },
      ];
      const numberDriver = { t: 0 };
      const numberElement = document.querySelector("#frame-01-seven-days-number");

      function numberAt(time) {
        for (let i = numberSequence.length - 1; i >= 0; i -= 1) {
          if (time >= numberSequence[i].t) return numberSequence[i].text;
        }
        return "1";
      }

      tl.to(
        numberDriver,
        {
          t: BEATS[4],
          duration: BEATS[4],
          ease: "none",
          onUpdate: () => {
            numberElement.textContent = numberAt(numberDriver.t);
          },
        },
        0,
      );

      tl.fromTo(
        ".frame-01-seven-days-mark",
        { scaleY: 0, opacity: 0.35 },
        {
          scaleY: 1,
          opacity: 1,
          duration: 0.4,
          stagger: 0.11,
          ease: "power3.out",
        },
        BEATS[2],
      );

      tl.fromTo(
        ".frame-01-seven-days-day-labels",
        { y: 42, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "circ.out" },
        BEATS[3],
      );

      tl.fromTo(
        "#frame-01-seven-days-dark",
        { yPercent: 102, skewY: 4 },
        { yPercent: 0, skewY: 0, duration: 0.24, ease: "expo.inOut" },
        BEATS[5],
      );

      tl.to(
        ".frame-01-seven-days-day-stage",
        {
          y: -90,
          scale: 1.1,
          filter: "blur(12px)",
          opacity: 0,
          duration: 0.2,
          ease: "power3.in",
        },
        BEATS[5],
      );

      tl.fromTo(
        "#frame-01-seven-days-final-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.32, ease: "power3.out" },
        BEATS[6],
      );

      tl.fromTo(
        "#frame-01-seven-days-make",
        { x: -210, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.44, ease: "expo.out" },
        BEATS[6],
      );

      tl.fromTo(
        "#frame-01-seven-days-visible",
        { y: 90, rotation: 3, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.48, ease: "circ.out" },
        BEATS[7],
      );

      tl.fromTo(
        "#frame-01-seven-days-brand",
        { y: 72, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        BEATS[8],
      );

      const holdStart = 2.6;
      const cycle = 0.7;
      const holdDuration = SCENE_DURATION - holdStart;
      tl.to(
        ".frame-01-seven-days-final",
        {
          scale: 1.006,
          duration: cycle / 2,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.max(0, Math.floor(holdDuration / cycle) - 1),
        },
        holdStart,
      );
    })();
  </script>
