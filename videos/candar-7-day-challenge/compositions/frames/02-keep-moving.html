  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameId = "02-keep-moving";
      const root = document.querySelector('[data-composition-id="' + frameId + '"]');
      const select = (value) => root.querySelector('[data-02-keep-moving="' + value + '"]');
      const selectAll = (value) => root.querySelectorAll('[data-02-keep-moving="' + value + '"]');

      const deviceStage = document.getElementById("f02-keep-moving-device-stage");
      const headlineCheck = document.getElementById("f02-keep-moving-headline-check");
      const headlineMove = document.getElementById("f02-keep-moving-headline-move");
      const statusEl = document.getElementById("f02-keep-moving-status");
      const cursorEl = document.getElementById("f02-keep-moving-cursor");
      const shimmer = document.getElementById("f02-keep-moving-rail-shimmer");
      const ticks = selectAll("tick");
      const railBlock = select("rail-block");
      const baseline = select("baseline");

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;

      tl.fromTo(
        deviceStage,
        { y: "12cqh", opacity: 0.12 },
        { y: "0cqh", opacity: 1, duration: 0.9, ease: "power3.out" },
        0
      );
      tl.fromTo(
        headlineCheck,
        { y: "6cqh", opacity: 0 },
        { y: "0cqh", opacity: 1, duration: 0.85, ease: "power3.out" },
        0.06
      );
      tl.fromTo(
        railBlock,
        { x: "5cqw", opacity: 0 },
        { x: "0cqw", opacity: 1, duration: 0.7, ease: "power3.out" },
        0.35
      );
      tl.fromTo(
        baseline,
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power1.out" },
        0.72
      );

      const tickStarts = [1.1, 1.32, 1.54, 1.76, 2.0, 2.35, 3.08];
      ticks.forEach((tick, index) => {
        tl.fromTo(
          tick,
          { scaleX: 0, opacity: 0.28 },
          {
            scaleX: 1,
            opacity: 1,
            duration: index === 6 ? 0.38 : 0.3,
            ease: "power3.out"
          },
          tickStarts[index]
        );
      });

      const sequence = [
        { t: 0.0, text: "" },
        { t: 1.16, text: "streak..." },
        { t: 1.72, text: "streak ready" },
        { t: 2.42, text: "streak protect" },
        { t: 2.66, text: "streak protected" }
      ];

      function textAt(time) {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index].text;
        }
        return "";
      }

      const textDriver = { t: 0 };
      tl.to(
        textDriver,
        {
          t: 4,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            statusEl.textContent = textAt(textDriver.t);
          }
        },
        0
      );

      const blinkDriver = { p: 0 };
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 12,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
          }
        },
        0
      );

      tl.to(
        headlineCheck,
        { y: "-4cqh", opacity: 0, duration: 0.26, ease: "power2.in" },
        2.54
      );
      tl.fromTo(
        headlineMove,
        { y: "5cqh", opacity: 0 },
        { y: "0cqh", opacity: 1, duration: 0.62, ease: "power3.out" },
        2.7
      );

      tl.fromTo(
        shimmer,
        { x: "0cqw", opacity: 0 },
        { x: "23cqw", opacity: 1, duration: 0.38, ease: "power2.inOut" },
        3.48
      );
      tl.to(
        shimmer,
        { opacity: 0, duration: 0.12, ease: "none" },
        3.86
      );
    })();
  </script>
