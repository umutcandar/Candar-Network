  <script>
    (() => {
      const compositionId = "04-start-today";
      const tl = gsap.timeline({ paused: true });

      const logoState = document.getElementById("f04-start-today-logo-state");
      const ctaState = document.getElementById("f04-start-today-cta-state");
      const support = document.getElementById("f04-start-today-support");
      const bloom = document.getElementById("f04-start-today-bloom");
      const urlState = document.getElementById("f04-start-today-url-state");
      const finalLogo = document.getElementById("f04-start-today-final-logo");
      const finalRule = document.getElementById("f04-start-today-final-rule");
      const dots = Array.from(
        document.querySelectorAll('[class~="04-start-today-dot"]')
      );
      const finalDots = Array.from(
        document.querySelectorAll('[class~="04-start-today-final-dot"]')
      );
      dots.forEach((dot, index) => {
        const targetX = Number(dot.dataset.targetX);
        const targetY = Number(dot.dataset.targetY);
        tl.fromTo(
          dot,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
          },
          {
            x: 0,
            y: 0,
            scale: 0.55,
            opacity: 0,
            duration: 0.72,
            ease: "power3.in",
          },
          0.08 + index * 0.035
        );
      });

      tl.fromTo(
        logoState,
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.58, ease: "back.out(1.45)" },
        0.36
      );

      tl.fromTo(
        ctaState,
        { scale: 0.7, opacity: 0 },
        { scale: 0.7, opacity: 0, duration: 0.01, ease: "none" },
        0
      );

      tl.to(
        logoState,
        { scale: 0.7, opacity: 0, duration: 0.36, ease: "power2.in" },
        1.0
      );
      tl.to(
        ctaState,
        { scale: 1, opacity: 1, duration: 0.58, ease: "back.out(1.8)" },
        1.2
      );
      tl.fromTo(
        support,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        1.66
      );

      tl.to(
        ctaState,
        { scale: 0.94, duration: 0.14, ease: "power1.in" },
        2.0
      );
      tl.to(
        ctaState,
        { scale: 1, duration: 0.19, ease: "power3.out" },
        2.14
      );

      tl.fromTo(
        bloom,
        { opacity: 0, scale: 0.84 },
        { opacity: 0.28, scale: 1, duration: 0.45, ease: "power2.out" },
        2.05
      );
      tl.to(
        bloom,
        { opacity: 0, duration: 0.3, ease: "power2.in" },
        2.5
      );

      tl.fromTo(
        urlState,
        { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none" },
        2.12
      );
      tl.fromTo(
        finalLogo,
        { opacity: 0, scale: 0.76, y: 28 },
        { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.45)" },
        2.3
      );

      const sequence = [
        { t: 0.0, text: "" },
        { t: 0.08, text: "candar" },
        { t: 0.2, text: "candarnetwork" },
        { t: 0.34, text: "candarnetwork.com" },
        { t: 0.5, text: "candarnetwork.com/download" },
      ];
      const urlElement = document.getElementById("f04-start-today-url");
      const textAt = (time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index].text;
        }
        return "";
      };
      const urlDriver = { t: 0 };
      tl.to(
        urlDriver,
        {
          t: 0.5,
          duration: 0.5,
          ease: "none",
          onUpdate: () => {
            urlElement.textContent = textAt(urlDriver.t);
          },
        },
        2.2
      );

      tl.to(
        ctaState,
        { opacity: 0, scale: 0.76, duration: 0.3, ease: "power2.in" },
        2.34
      );
      tl.fromTo(
        finalRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.28, ease: "power3.out" },
        2.4
      );
      tl.fromTo(
        finalDots,
        { scale: 0, opacity: 0 },
        {
          scale: 1,
          opacity: 1,
          duration: 0.28,
          ease: "back.out(1.5)",
          stagger: 0.03,
        },
        2.34
      );

      tl.to({}, { duration: 1.2 }, 2.8);

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;
    })();
  </script>
