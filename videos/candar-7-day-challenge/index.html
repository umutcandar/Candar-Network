<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-seven-days"
        class="scene"
        data-composition-id="01-seven-days"
        data-composition-src="compositions/frames/01-seven-days.html"
        data-start="0"
        data-duration="3.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-keep-moving"
        class="scene"
        data-composition-id="02-keep-moving"
        data-composition-src="compositions/frames/02-keep-moving.html"
        data-start="3"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-grow-together"
        class="scene"
        data-composition-id="03-grow-together"
        data-composition-src="compositions/frames/03-grow-together.html"
        data-start="7"
        data-duration="4.6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-start-today"
        class="scene"
        data-composition-id="04-start-today"
        data-composition-src="compositions/frames/04-start-today.html"
        data-start="11"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-seven-days", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3);
        tl.fromTo("#el-02-keep-moving", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3);
        tl.to("#el-02-keep-moving", { x: -1080, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.fromTo("#el-03-grow-together", { x: 1080, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.to("#el-03-grow-together", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-04-start-today", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 11);
        tl.to({}, { duration: 15 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
